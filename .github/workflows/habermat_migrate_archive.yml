name: Habermat Eski Haberleri Kesfet ve SEO Kurallarina Gore Guncelle

on:
  workflow_dispatch:
    inputs:
      max_covers:
        description: 'Güncellenecek maksimum eski haber sayısı'
        required: false
        default: '500'

permissions:
  contents: write

jobs:
  migrate-old-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python Kütüphanelerini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Eski Haberlerin Kapak Görsellerini (1200x675 WebP), İç Linklerini ve JobPosting Şemalarını Güncelle
        env:
          WP_URL: ${{ secrets.WP_URL || 'https://habermat.com' }}
          WP_USERNAME: ${{ secrets.WP_USERNAME || 'editor' }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
        run: |
          python migrate_old_posts.py --max-covers "${{ github.event.inputs.max_covers || '500' }}"

      - name: Güncelleme Durumunu Kaydet
        if: always()
        run: |
          git config user.name "habermat-bot"
          git config user.email "bot@habermat.com"
          git add data/migrated_posts.json data/published_history.json
          git diff --staged --quiet || (git commit -m "chore: eski haberler Kesfet WebP ve SEO kurallarina gore guncellendi" && git pull --rebase --autostash -X theirs && git push)
