name: Habermat.com Saatlik Haber Otomasyonu

on:
  schedule:
    # Türkiye saati (UTC+3) ile sabah 07:00'den gece 24:00'e (00:00) kadar her saat çalışır.
    # GitHub Actions yoğunluk kaynaklı gecikmeleri önlemek için her saatin 1., 15. ve 30. dakikasında tetiklenir
    # (main.py içinde o saat yayınlandıysa mükerrer yayını otomatik atlayan koruma mevcuttur).
    - cron: '1,15,30 4-21 * * *'

  workflow_dispatch:
    inputs:
      force_category:
        description: 'Kategori seçin (boş bırakılırsa saatin kategorisi çalışır)'
        required: false
        default: ''
      dry_run:
        description: 'Sadece test üretimi yap (Paylaşmadan görseli ve makaleyi üretir)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Türkçe Font Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python Kütüphanelerini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt

      - name: Saatlik Habermat.com Haber Botunu Çalıştır (Sadece Web Sitesi)
        env:
          WP_URL: ${{ secrets.WP_URL || 'https://habermat.com' }}
          WP_USERNAME: ${{ secrets.WP_USERNAME || 'editor' }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_CATEGORY: ${{ github.event.inputs.force_category }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Üretilen Kapak Görseli ve Makaleyi Arşivle (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habermat-output-${{ github.run_number }}
          path: |
            output/featured_image.webp
            output/latest_package.json
          retention-days: 1

      - name: Paylaşılan Haber Geçmişini Kaydet (Tekrar Önleme)
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "habermat-bot"
          git config user.email "bot@habermat.com"
          git add data/published_history.json
          git diff --staged --quiet || (git commit -m "chore: saatlik haber gecmisi guncellendi" && git pull --rebase --autostash -X theirs && git push)
