name: Habermat.com Saatlik Haber ve Reels Otomasyonu

on:
  schedule:
    # Türkiye saati (UTC+3) ile sabah 07:00'den gece 24:00'e (00:00) kadar her saat başı çalışır
    # UTC karşılığı: 04:00 - 21:00 arası her saat başı (Toplam 18 kez/gün)
    - cron: '1 4-21 * * *'

  workflow_dispatch:
    inputs:
      force_category:
        description: 'Kategori seçin (boş bırakılırsa saatin kategorisi çalışır: devlet_yardimlari, emeklilik, toki_konut, belediye_yardimlari, kirtasiye_egitim, erzak_gida, kiyafet_yakacak, kredi_banka)'
        required: false
        default: ''
      dry_run:
        description: 'Sadece test üretimi yap (Paylaşmadan video ve görseli üretir)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  publish-news-and-reels:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: FFmpeg ve Türkçe Font Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python Kütüphanelerini ve Tarayıcıyı Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Saatlik Haber ve TikTok Video Botunu Çalıştır
        env:
          WP_URL: ${{ secrets.WP_URL || 'https://habermat.com' }}
          WP_USERNAME: ${{ secrets.WP_USERNAME || 'editor' }}
          WP_PASSWORD: ${{ secrets.WP_PASSWORD }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME || 'habermat5' }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
          IG_USERNAME: ${{ secrets.IG_USERNAME || 'haberoku34' }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_CATEGORY: ${{ github.event.inputs.force_category }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Üretilen Görsel ve Reels Videosunu Arşivle (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habermat-output-${{ github.run_number }}
          path: |
            output/featured_image.jpg
            output/reels_video.mp4
            output/latest_package.json
          retention-days: 1

      - name: Paylaşılan Haber Geçmişini Kaydet (Tekrar Önleme)
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "habermat-bot"
          git config user.email "bot@habermat.com"
          git add data/published_history.json
          git diff --staged --quiet || git commit -m "chore: saatlik haber gecmisi guncellendi [skip ci]"
          git push
